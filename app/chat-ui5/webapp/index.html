<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HR 助手</title>
  <script id="sap-ui-bootstrap"
    src="https://ui5.sap.com/1.120/resources/sap-ui-core.js"
    data-sap-ui-libs="sap.m,sap.ui.core,sap.ui.layout"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"
    data-sap-ui-frameOptions="allow"
    data-sap-ui-resourceroots='{"onboarding.kb.chat": "./"}'></script>
  <script>
    sap.ui.getCore().attachInit(function () {
      sap.ui.require(["sap/m/Shell", "sap/ui/core/ComponentContainer"], function (Shell, ComponentContainer) {
        new Shell({
          title: "HR 助手",
          app: new ComponentContainer({
            name: "onboarding.kb.chat",
            settings: { id: "onboarding.kb.chat" },
            async: true
          }),
          appWidthLimited: false
        }).placeAt("content");
      });
    });
  </script>
</head>
<body class="sapUiBody" id="content"></body>
</html>
